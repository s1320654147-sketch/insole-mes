<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鞋垫工厂轻 MES Alpha</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <div class="login-screen" id="login-screen">
      <form class="login-card" id="login-form">
        <div class="brand-line">Insole MES Alpha</div>
        <h1>工厂管理端登录</h1>
        <label>
          账号
          <input id="username" autocomplete="username" value="admin" />
        </label>
        <label>
          密码
          <input id="password" type="password" autocomplete="current-password" value="admin123" />
        </label>
        <button class="primary-btn" type="submit">登录</button>
        <p id="login-error" class="login-error"></p>
      </form>
    </div>

    <div class="app-shell hidden" id="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>
            <div class="brand-title">Insole MES</div>
            <div class="brand-subtitle">鞋垫打样与小批量生产</div>
          </div>
        </div>
        <nav class="nav">
          <button class="nav-item active" data-view="dashboard">总览</button>
          <button class="nav-item" data-view="samples">样品单</button>
          <button class="nav-item" data-view="orders">工单</button>
          <button class="nav-item" data-view="materials">物料库存</button>
          <button class="nav-item" data-view="reporting">报工台</button>
          <button class="nav-item" data-view="alerts">预警中心</button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="view-title">总览</h1>
            <p id="view-subtitle">先把样品、工单、物料和进度抓在手里。</p>
          </div>
          <div class="topbar-actions">
            <div class="user-pill" id="current-user">未登录</div>
            <a class="ghost-btn link-btn" href="./mobile.html">手机端预览</a>
            <button class="ghost-btn" id="refresh-btn">刷新数据</button>
            <button class="primary-btn" id="new-order-btn" type="button">新建生产单</button>
            <button class="ghost-btn" id="logout-btn" type="button">退出登录</button>
          </div>
        </header>

        <section class="view active" id="dashboard-view">
          <div class="stats-grid" id="stats-grid"></div>
          <div class="panel-grid two-up">
            <section class="panel">
              <div class="panel-head">
                <h2>今日重点工单</h2>
                <span class="badge">实时</span>
              </div>
              <div id="focus-orders"></div>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h2>缺料与风险</h2>
                <span class="badge warn">优先处理</span>
              </div>
              <div id="risk-list"></div>
            </section>
          </div>
          <div class="panel-grid two-up">
            <section class="panel">
              <div class="panel-head">
                <h2>工序进度</h2>
                <span class="badge">车间状态</span>
              </div>
              <div id="stage-board"></div>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h2>最近操作</h2>
                <span class="badge">留痕</span>
              </div>
              <div id="activity-list"></div>
            </section>
          </div>
        </section>

        <section class="view" id="samples-view">
          <div class="panel-grid two-up">
            <section class="panel">
              <div class="panel-head">
                <h2>样品单列表</h2>
                <div class="panel-actions">
                  <span class="badge">按项目追踪</span>
                  <button class="ghost-btn slim-btn" id="new-sample-btn" type="button">新建样品单</button>
                </div>
              </div>
              <div id="sample-table"></div>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h2 id="sample-editor-title">样品单编辑</h2>
                <span class="badge">表单保存</span>
              </div>
              <div id="sample-editor"></div>
            </section>
          </div>
        </section>

        <section class="view" id="orders-view">
          <div class="panel-grid two-up">
            <section class="panel">
              <div class="panel-head">
                <h2>工单列表</h2>
                <span class="badge">工单驱动</span>
              </div>
              <div id="order-table"></div>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h2 id="order-editor-title">工单详情</h2>
                <div class="panel-actions">
                  <span class="badge">当前选中</span>
                  <button class="ghost-btn slim-btn" id="new-order-inline-btn" type="button">新建生产单</button>
                </div>
              </div>
              <div id="order-detail"></div>
            </section>
          </div>
        </section>

        <section class="view" id="materials-view">
          <section class="panel">
            <div class="panel-head">
              <h2>物料库存</h2>
              <span class="badge">批次库存</span>
            </div>
            <div id="material-table"></div>
          </section>
        </section>

        <section class="view" id="reporting-view">
          <div class="panel-grid two-up">
            <section class="panel">
              <div class="panel-head">
                <h2>待报工工序</h2>
                <span class="badge">现场操作</span>
              </div>
              <div id="reporting-queue"></div>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h2>报工记录</h2>
                <span class="badge">手机端回流</span>
              </div>
              <div id="report-table"></div>
            </section>
          </div>
        </section>

        <section class="view" id="alerts-view">
          <section class="panel">
            <div class="panel-head">
              <h2>预警中心</h2>
              <span class="badge warn">先做能提醒你的事</span>
            </div>
            <div id="alerts-list"></div>
          </section>
        </section>
      </main>
    </div>

    <div class="toast" id="toast">已处理</div>
    <script src="./admin-app.js"></script>
  </body>
</html>
