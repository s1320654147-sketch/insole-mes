services:
  - type: web
    name: insole-mes-demo
    runtime: static
    rootDir: .
    staticPublishPath: ./prototype
    buildCommand: echo "Static demo ready"

  - type: web
    name: insole-mes-alpha
    runtime: node
    rootDir: ./alpha
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: insole-mes-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true

databases:
  - name: insole-mes-db
    databaseName: insole_mes
    user: insole_mes_user
